name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint and test
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # The throwaway server of the Postgres tests; the digest is the image scripts/test_postgres.sh runs, so keep them equal.
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"

      # This is the only step that installs, and it installs only what the
      # lockfile resolved: --locked refuses a stale lock instead of resolving
      # fresh versions. Only one build is allowed, the git-pinned
      # overnightworks library named in pyproject.toml (tool.uv), run with
      # exact build tools; --no-build refuses every other source distribution,
      # whose build script would run third-party code on the runner, so third-party
      # packages are wheel-only. skat itself stays out of the environment: nothing
      # below needs it installed, because pytest puts src/ on the import path
      # (pyproject.toml, tool.pytest.ini_options.pythonpath). The steps below then
      # call their tool straight from that environment instead of installing again.
      - name: Install dependencies
        run: |
          uv sync --locked --no-install-project --no-build
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"

      # The Makefile owns what lint means. UV_NO_SYNC keeps its `uv run` calls
      # on the environment installed above instead of installing the project.
      - name: Lint
        env:
          UV_NO_SYNC: "1"
        run: make lint

      - name: Find dead code
        env:
          UV_NO_SYNC: "1"
        run: make dead

      # Which files are measured is pyproject.toml's to say (the source key
      # under [tool.coverage.run]). 100 % is judged by the Coverage job over
      # the unit and end-to-end data together, not here.
      - name: Test with coverage
        env:
          COVERAGE_FILE: .coverage.unit
          SKAT_TEST_POSTGRES_URL: postgresql+psycopg://postgres@localhost:5432/postgres
        run: pytest -q -n auto -m "not e2e"

      - name: Upload the unit coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-unit
          path: .coverage.unit
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  e2e-shard:
    name: End-to-end shard ${{ matrix.shard }}
    # One runner per shard: the suite saturates a runner's cores, so only more runners shorten it.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    # The throwaway server of the Postgres tests; the digest is the image scripts/test_postgres.sh runs, so keep them equal.
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the page build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: page-build
          path: src/skat/web/build

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          package_json_file: frontend/package.json

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: frontend/package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          uv sync --locked --no-install-project --no-build
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"

      # apt on the runner can stall on a slow mirror; each attempt is bounded so
      # a stall costs one retry instead of the test budget.
      - name: Install Chromium
        id: install-chromium
        continue-on-error: true
        timeout-minutes: 6
        run: playwright install --with-deps chromium

      - name: Install Chromium again
        if: steps.install-chromium.outcome == 'failure'
        timeout-minutes: 6
        run: |
          # The timed-out attempt leaves its apt-get running and holding the dpkg lock.
          sudo pkill -x apt-get || true
          sudo pkill -x apt || true
          while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 1; done
          playwright install --with-deps chromium

      - name: Run the end-to-end tests
        timeout-minutes: 10
        env:
          COVERAGE_FILE: .coverage.e2e-${{ matrix.shard }}
          SKAT_E2E_SHARD: ${{ matrix.shard }}
          SKAT_E2E_SHARDS: 3
          SKAT_TEST_POSTGRES_URL: postgresql+psycopg://postgres@localhost:5432/postgres
          SKAT_BROWSER_COVERAGE_DIR: ${{ runner.temp }}/browser-coverage-raw
        run: pytest -m e2e -n auto --durations=20 --tracing retain-on-failure --screenshot only-on-failure --output test-results

      - name: Upload the end-to-end coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-e2e-${{ matrix.shard }}
          path: .coverage.e2e-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload the raw browser coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-coverage-raw-${{ matrix.shard }}
          path: ${{ runner.temp }}/browser-coverage-raw
          if-no-files-found: error
          retention-days: 1

      - name: Upload the traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ matrix.shard }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 1

  # The mandatory job of the quality gate: it stands for the shards, and converts their browser coverage once because
  # the conversion fails on a shipped source with code and no record in any shard.
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [frontend, e2e-shard]
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the page build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: page-build
          path: src/skat/web/build

      - name: Fetch the raw browser coverage of every shard
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: browser-coverage-raw-*
          merge-multiple: true
          path: ${{ runner.temp }}/browser-coverage-raw

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          package_json_file: frontend/package.json

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: frontend/package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # The page build's hidden source maps map Chromium's coverage to frontend/src. The step fails on a shipped source
      # with code and no record; the Coverage job judges the merged report.
      - name: Convert the browser coverage to lcov
        working-directory: frontend
        env:
          SKAT_BROWSER_COVERAGE_DIR: ${{ runner.temp }}/browser-coverage-raw
        run: |
          pnpm install --frozen-lockfile
          node scripts/browser-coverage-report.js "${SKAT_BROWSER_COVERAGE_DIR}" ../src/skat/web/build ../browser-coverage

      - name: Upload the browser coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-coverage
          path: browser-coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

      - name: Report how much longer the slowest shard ran than on main
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The slowest shard's seconds; main's last run before the shards ran the suite in the one job "End-to-end".
          duration() {
            local run_id=$1
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" --jq \
              '[.jobs[] | select(.name | test("^End-to-end( shard .)?$")) | (.completed_at // (now | todate) | fromdate) - (.started_at | fromdate)] | max'
          }
          main_run=$(gh run list --branch main --workflow ci.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          this_duration=$(duration "${GITHUB_RUN_ID}")
          main_duration=$(duration "${main_run}")
          echo "Slowest end-to-end shard: ${this_duration} s; main's last green run (${main_run}): ${main_duration} s; longer by $((this_duration - main_duration)) s"

  coverage:
    name: Coverage
    needs: [ci, e2e, e2e-shard, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          uv sync --locked --no-install-project --no-build
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"

      - name: Fetch the coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Fetch the frontend coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Fetch the browser coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-coverage
          path: browser-coverage

      # The branch contract: 100 % over unit, integration and end-to-end
      # together. The xml is the report the quality gate's scan reads.
      - name: Judge the combined coverage
        run: |
          coverage combine .coverage.unit .coverage.e2e-*
          coverage report --fail-under=100
          coverage xml -o coverage.xml

      # Vitest's records stand for the files it reports; the browser's cover the rest. The script fails below 100 %.
      - name: Merge the frontend coverage
        run: python scripts/merge_frontend_coverage.py frontend/coverage/lcov.info browser-coverage/lcov.info frontend/coverage/merged-lcov.info

      - name: Upload the coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage.xml
            frontend/coverage/merged-lcov.info
          if-no-files-found: error
          retention-days: 1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version comes from packageManager in frontend/package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          package_json_file: frontend/package.json

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: frontend/package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Upload the frontend coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

      - name: Upload the page build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: page-build
          path: src/skat/web/build
          if-no-files-found: error
          retention-days: 1

  image:
    name: Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image without pushing it
        run: docker build --tag skat-image .

      # The wheel is gone from the image; its record of installed files remains.
      - name: Check that the wheel carries the page build
        run: >
          docker run --rm --entrypoint python skat-image -c
          "from importlib.metadata import files; assert any(str(f) == 'skat/web/build/index.html' for f in files('skat'))"

  quality:
    name: quality
    needs: [ci, e2e-shard, e2e, coverage, frontend, image]
    if: always()
    permissions:
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/gate.yml@2d2b68bf3916b34f6f2c72a540c1e3d8a947b750 # v0.10.0
    with:
      coverage-artifact: coverage
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

sonar.organization=overnightworks
sonar.projectKey=overnightworks_skat
# `sonar.sources` is an allowlist, so code this repository runs but does not
# name here is code no rule can fire on, in either direction, while the
# project still reports zero findings.
#
# `.github` is named whole rather than the workflows beneath it: everything under
# it runs with this repository's credentials, so a composite action added later is
# analysed without another change here.
#
# `Dockerfile` is named for the same reason: the image is code this repository
# runs, and without it Sonar's Docker rules (root user, pinning) never fire.
#
# Which Python files are measured for coverage is pyproject.toml's to say, under
# [tool.coverage.run].
sonar.sources=src/skat,frontend/src,.github,Dockerfile
# frontend/src/app.html is the template every route renders into, not a page.
# Each route owns its title through <svelte:head>, and a <title> here would be
# each page's first and override the sign-in pages' kit title. The gate refuses
# sonar.issue.ignore keys, and prettier moves a NOSONAR comment off the <head>
# line the HTML analyzer reports.
#
# src/skat/web/words.py is generated from the catalog by design-catalogs, whose
# --check in lint and CI is its gate, not maintained source. Three keys of three
# surfaces carry the same German text on purpose, so python:S1192 fires on it.
sonar.exclusions=**/node_modules/**,**/.svelte-kit/**,frontend/coverage/**,src/skat/web/build/**,frontend/src/app.html,src/skat/web/words.py
sonar.tests=tests,frontend
sonar.test.inclusions=tests/**,frontend/src/**/*.test.ts
sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/merged-lcov.info
# Browser code is covered by Vitest for the TypeScript it reports and by the
# end-to-end suite for the rest; scripts/merge_frontend_coverage.py merges both.
# SonarCloud does not index .svelte files, so their records stay unresolved.
# why: generated from the Python path owners by scripts/generate_wire.py, not maintained source.
# why: the generated word modules (frontend/src/lib/words/*.ts) hold every language's catalog under the same keys, so the languages duplicate one another by construction; `make words-check` proves them against the catalogs.
sonar.cpd.exclusions=frontend/src/lib/wire.ts,frontend/src/lib/words/*.ts
# why: the generated word modules (frontend/src/lib/words/*.ts) are measured by neither coverage path, vite.config.ts and browser-coverage-report.js exclude them, so a file with no lcov record would count as fully uncovered.
sonar.coverage.exclusions=frontend/src/lib/words/*.ts

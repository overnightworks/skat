[gate]
mandatory_jobs = ["Lint and test", "End-to-end", "Coverage", "Frontend", "Image"]

[[root.allow]]
entry = "Makefile"
reason = "make finds its Makefile only in the directory it runs from"

[[root.allow]]
entry = "frontend/"
reason = "the SvelteKit project is a toolchain of its own: its manifest, lockfile and configuration must sit in its project directory"

[[root.allow]]
entry = "legal/"
reason = "hal reads the app's part of the legal pages from its release at exactly legal/datenschutz.html and legal/nutzungsbedingungen.html"

[[gate.loosened]]
what = 'import contract "The table core imports no framework, driver or adapter" changes forbidden_modules'
item = "overnightworks/skat#275"
date = 2026-11-10
reason = "the agent runtime library is renamed to agents, so the contract forbids the new module name in place of agent_runtime_client"

